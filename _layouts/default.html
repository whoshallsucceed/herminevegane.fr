<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      {% if page.title %}
        {{ page.title }} — {{ site.title }}
      {% else %}
        {{ site.title }}
      {% endif %}
    </title>

    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo-mark.svg' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>
    {% include header.html %}

    <script>
      (function () {
        var marks = ["paw", "vache", "cochon", "poule", "mouton", "chevre"];
        var pick = marks[Math.floor(Math.random() * marks.length)];
        var src = "/assets/images/marks/" + pick + ".svg?v=" + Date.now();
        var mark = document.querySelector(".logo-mark");
        if (mark) {
          mark.src = src;
        }
        var favicon = document.querySelector('link[rel="icon"]');
        if (favicon) {
          favicon.href = src;
        }
      })();
    </script>

    <main class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
