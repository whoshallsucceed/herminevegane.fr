<a class="post-card" href="{{ include.post.url | relative_url }}">
  <span class="post-card__number">
    // {{ include.number }}
  </span>

  <div>
    {% assign card_meta = include.post.categories | join: " · " %}
    {% if card_meta != "" %}
      <div class="post-card__meta">
        {{ card_meta }}
      </div>
    {% endif %}

    <h2 class="post-card__title">
      {{ include.post.title }}
    </h2>

    {% if include.post.description %}
      <p class="post-card__meta">
        {{ include.post.description }}
      </p>
    {% endif %}
  </div>
</a>
